<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Фулбади">
<meta name="theme-color" content="#09090b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Дневник фулбади</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: одна узкая колонка под телефон, липкие вкладки, карточка на каждое упражнение в порядке выполнения */
:root{
  color-scheme:dark;
  --bg:#09090b; --surface:#131316; --surface-2:#1c1c22; --ink:#f4f4f5; --muted:#9d9da8; --line:#2b2b33;
  --accent:#ff3b30; --accent-ink:#ffffff; --accent-soft:rgba(255,59,48,.14);
  --good:#30d158; --good-soft:rgba(48,209,88,.13); --warn:#ffd60a; --warn-soft:rgba(255,214,10,.11); --danger:#ff453a; --danger-soft:rgba(255,69,58,.13);
  --f-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;min-height:100vh}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.05;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0;letter-spacing:.02em;text-transform:uppercase}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:20px}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.save.ok::before{background:var(--good)} .save.pending::before{background:var(--warn)} .save.err{color:var(--danger)} .save.err::before{background:var(--danger)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 0}
.tabs button{font:600 14px var(--f-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px}
.day{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.day-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,textarea{font:500 16px var(--f-num);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-body);font-size:15px;resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.daysel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daysel button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
.daysel button b{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.daysel button span{font-size:11px;color:var(--muted)}
.daysel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.daysel button[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.phase{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border-radius:10px;padding:9px 12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.phase b{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.phase span{color:var(--muted);font-size:13px}
.phase.deload{background:var(--warn-soft)} .phase.intro{background:var(--good-soft)}
.progressline{font-size:13px;color:var(--muted)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.c-head{display:flex;gap:10px;align-items:flex-start}
.num{font:600 15px var(--f-display);min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}
.base .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.c-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-title strong{font-weight:600;font-size:16px;line-height:1.25}
.c-meta{font-size:13px;color:var(--muted)}
.c-meta .tgt{font-family:var(--f-num);color:var(--ink);font-weight:600}
.variants{display:flex;flex-wrap:wrap;gap:6px}
.variants button{font-size:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;text-align:left}
.variants button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.variants .lbl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.chip{align-self:flex-start;font-size:13px;font-weight:600;border-radius:8px;padding:5px 10px;background:var(--surface-2);color:var(--muted)}
.chip.up{background:var(--good-soft);color:var(--good)} .chip.deload{background:var(--warn-soft);color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:32px minmax(0,1fr) 16px minmax(0,1fr);gap:8px;align-items:center}
.set-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.set .n{font:500 14px var(--f-num);color:var(--muted);text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{text-align:center;font-variant-numeric:tabular-nums}
.set.extra .n{color:var(--accent)}
.c-actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:13px;font-weight:600;border-radius:9px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.last{font-size:13px;color:var(--muted);margin:0}
.last b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font:500 26px var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.stat small.good{color:var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.muted{color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog-row:first-of-type{border-top:0}
.prog-row .nm{font-weight:600;font-size:14px}
.prog-row .sub{font-size:12px;color:var(--muted)}
.prog-row .best{font-family:var(--f-num);font-size:13px}
.prog-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0;padding-top:6px}
.delta{font-family:var(--f-num);font-size:12px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--danger)}
.spark-empty{font-size:11px;color:var(--muted);text-align:right}
.hist{display:flex;flex-direction:column}
.h-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.h-row:first-child{border-top:0}
.h-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.h-main b{font-family:var(--f-num);font-weight:600;font-size:14px}
.h-main span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.h-acts{display:flex;gap:6px}
.empty{text-align:center;padding:22px 14px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:18px;margin-bottom:4px;text-transform:uppercase}
.prog-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prog-list li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.prog-list li:first-child{border-top:0}
.prog-list .alts{font-size:13px;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:12px}
.finish{gap:8px}
.finish p{margin:0;font-size:14px}
.done-head{display:flex;flex-direction:column;gap:6px}
.done-badge{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--good-soft);color:var(--good);border-radius:8px;padding:4px 10px}
.gains{background:var(--good-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.gains b{color:var(--good)}
.gains ul{margin:0;padding-left:18px}
.gains span{font-family:var(--f-num);font-size:13px}
.sum-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.sum-row:first-child{border-top:0}
.sum-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-main b{font-weight:600;font-size:14px}
.sum-main span{font-family:var(--f-num);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sum-row.miss .sum-main b{color:var(--muted)}
.draft{color:var(--warn);font-weight:600}

/* Таймер отдыха */
.tbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 12px;box-shadow:0 10px 34px rgba(0,0,0,.6);white-space:nowrap}
.tbar .t-time{font:600 22px var(--f-num);color:var(--ink);min-width:66px;text-align:center;font-variant-numeric:tabular-nums}
.tbar .t-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbar button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer}
.tbar button.t-stop{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.tbar.ringing{border-color:var(--accent);animation:tpulse 1s ease-in-out infinite}
.tbar.ringing .t-time{color:var(--accent)}
@keyframes tpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}50%{box-shadow:0 0 0 10px rgba(255,59,48,0)}}

/* Календарь */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head b{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.cal-day{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font:500 13px var(--f-num);color:var(--muted);background:transparent;border:1px solid transparent;cursor:pointer;padding:0}
.cal-day:active{background:var(--surface-2)}
.cal-day.has{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));font-weight:600}
.cal-day.ok{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--ink)}

@media (prefers-reduced-motion: no-preference){.card,.panel{transition:border-color .2s}}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">Фулбади · 2 дня в чередовании · 8-недельный цикл</div>
      <h1>Дневник тренировок</h1>
    </div>
    <span id="saveState" class="save" aria-live="polite">Загрузка…</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="tab-log" data-tab="log" aria-selected="true">Тренировка</button>
    <button role="tab" id="tab-prog" data-tab="prog" aria-selected="false">Прогресс</button>
    <button role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Программа</button>
  </nav>
  <div id="notice"></div>
  <main id="view"></main>
</div>

<div id="timerBar" class="tbar" hidden>
  <span class="t-time" id="tTime">0:00</span>
  <span class="t-label" id="tLabel">отдых</span>
  <button type="button" data-tact="plus">+30</button>
  <button type="button" data-tact="minus">−15</button>
  <button type="button" class="t-stop" data-tact="stop">Стоп</button>
</div>

<script src="app1.js"></script>
<script src="app2.js"></script>
</body>
</html>
